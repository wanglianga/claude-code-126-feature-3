openapi: 3.0.3
info:
  title: 咖啡连锁外卖出杯时效与骑手交接服务
  version: 1.0.0
  description: >
    覆盖外卖平台接单（美式/拿铁/冷萃/果咖/轻食/组合套餐）、原料库存扣减、门店产能与爆单保护、
    按序出杯、封签扫描入待取区、冷热分袋、骑手到店核验（订单号/袋数/冷热分袋/吸管餐具）、
    骑手提前到店、饮品过久重做、漏看备注、错杯、轻食缺货、取错袋、平台取消、漏液投诉等异常，
    并把门店、店员、骑手、顾客、平台客服、财务赔付连接到同一订单时间线；
    支持多平台订单合并、缺货临时下架、杯贴/袋贴打印、异常报损、骑手到店屏、
    区域利润报表、班组评分与督导复盘。


    鉴权：所有 /v1 接口（除 /v1/auth/login）需要 `X-Staff-Code: <工号>` 请求头，
    或先登录后使用 `Authorization: Bearer <token>`。
servers:
  - url: /
    description: 本机/容器
tags:
  - name: auth
  - name: catalog
  - name: orders
  - name: platform
  - name: store-ops
  - name: rider
  - name: customer
  - name: finance
  - name: management
security:
  - StaffCode: []
paths:
  /healthz:
    get:
      tags: [catalog]
      security: []
      summary: 健康检查（PG/Redis）
      responses:
        '200': {description: OK}
  /v1/auth/login:
    post:
      tags: [auth]
      security: []
      summary: 用工号换取 Bearer Token（也可全程直接用 X-Staff-Code）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: {type: string, example: "3001"}
      responses:
        '200': {description: OK}
        '401': {description: 工号无效}
  /v1/auth/me:
    get:
      tags: [auth]
      summary: 当前登录人
      responses:
        '200': {description: OK}
  /v1/stores:
    get:
      tags: [catalog]
      summary: 门店列表
      responses:
        '200': {description: OK}
  /v1/stores/{id}:
    get:
      tags: [catalog]
      summary: 门店详情
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      responses:
        '200': {description: OK}
  /v1/menu:
    get:
      tags: [catalog]
      summary: 菜单（6 类商品）
      responses:
        '200': {description: OK}
  /v1/stores/{id}/inventory:
    get:
      tags: [catalog]
      summary: 门店原料库存
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      responses:
        '200': {description: OK}
  /v1/stores/{id}/delistings:
    get:
      tags: [catalog]
      summary: 临时下架记录
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
        - {name: active, in: query, schema: {type: string, enum: ["0","1"]}}
      responses:
        '200': {description: OK}
  /v1/stores/{id}/board:
    get:
      tags: [store-ops]
      summary: 门店作业看板（在制杯量/爆单/待取超时/等待骑手/异常/下架）
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      responses:
        '200': {description: OK}
  /v1/platform/orders:
    post:
      tags: [platform]
      summary: 平台/门店接单（扣库存、校验爆单与缺货，幂等支持 Idempotency-Key）
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntakeRequest'
      responses:
        '201': {description: 已接单}
        '409':
          description: 爆单限流(surge_full/surge_paused)/缺货下架(item_delisted)/库存不足(stock_shortage)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /v1/platform/orders/{id}/cancel:
    post:
      tags: [platform]
      summary: 平台取消订单（未做回库、已封报损、退款、按是否门店责任归责）
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: {type: string, example: 顾客申请退款}
                store_fault: {type: boolean, description: 是否门店责任（如出杯超时导致取消）}
      responses:
        '200': {description: 已取消}
  /v1/orders/{id}:
    get:
      tags: [orders]
      summary: 订单详情（含杯、袋）
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      responses:
        '200': {description: OK}
  /v1/orders/{id}/events:
    get:
      tags: [orders]
      summary: 订单全链路时间线（门店/店员/骑手/顾客/客服/财务）
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      responses:
        '200': {description: OK}
  /v1/orders/{id}/exceptions:
    get:
      tags: [orders]
      summary: 订单异常列表
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      responses:
        '200': {description: OK}
  /v1/stores/{id}/orders:
    get:
      tags: [orders]
      summary: 门店订单列表
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
        - {name: status, in: query, schema: {type: string, enum: [received, active, handed, canceled]}}
      responses:
        '200': {description: OK}
  /v1/staff/merge:
    post:
      tags: [store-ops]
      summary: 多平台订单合并（同一骑手一次取走多平台单）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_ids]
              properties:
                store_id: {type: integer}
                order_ids:
                  type: array
                  items: {type: integer}
                  example: [1, 2]
                note: {type: string}
      responses:
        '201': {description: 已合并}
  /v1/merged-groups/{id}:
    get:
      tags: [store-ops]
      summary: 合并组详情
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      responses:
        '200': {description: OK}
  /v1/staff/stores/{id}/queue:
    get:
      tags: [store-ops]
      summary: 出杯顺序队列（骑手 ETA 早的优先，含顾客备注/杯备注）
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      responses:
        '200': {description: OK}
  /v1/staff/stores/{id}/cups/next:
    post:
      tags: [store-ops]
      summary: 店员叫号取下一杯开始制作（FOR UPDATE SKIP LOCKED）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [store_id]
              properties:
                store_id: {type: integer}
      responses:
        '200': {description: OK}
        '409': {description: 队列空}
  /v1/staff/cups/{id}/start:
    post:
      tags: [store-ops]
      summary: 指定杯开始制作
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      responses:
        '200': {description: OK}
  /v1/staff/cups/{id}/seal:
    post:
      tags: [store-ops]
      summary: 店员扫描封签 → 入冷热/餐食分袋 → 全单封齐进待取区
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      responses:
        '200': {description: 已封签}
  /v1/staff/cups/{id}/remake:
    post:
      tags: [store-ops]
      summary: >
        重做（饮品放置过久/错杯/漏看备注）。两阶段工作流：原杯进入 loss_hold 报损留存且旧封签码立即失效、
        扣新杯原料、新杯以新制作序号入队；自动生成顾客补偿方案；成本分别归因（报损/原料/财务/等待/补偿）。
        并发安全：同一杯链同时只允许一个进行中的重做。
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, enum: [stale_drink, wrong_cup, note_missed]}
                detail: {type: object, additionalProperties: true}
      responses:
        '201': {description: 已生成重做杯（remake_id/factors/loss_cost）}
        '409': {description: 订单已交接/取消、杯已报损、已有进行中重做}
  /v1/staff/cups/{id}/stale-check:
    get:
      tags: [store-ops]
      summary: 单杯放置过久评估（按 饮品类型×冰热×门店忙闲×放置时长，只读不产生副作用）
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
        - {name: force_busy, in: query, schema: {type: string, enum: ["0","1"]}, description: 强制按忙时阈值评估}
      responses:
        '200': {description: OK（stale/safe_minutes/hard_safe_minutes/busyness/elapsed_minutes 等因子）}
  /v1/staff/stores/{id}/stale-check:
    post:
      tags: [store-ops]
      summary: 扫描门店待取区所有已封杯，返回过久杯清单；auto_remake=true 时按规则自动触发重做
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                auto_remake: {type: boolean}
                force_busy: {type: boolean}
      responses:
        '200': {description: OK（stale_cups / triggered_remakes）}
  /v1/staff/cups/{id}/label-print:
    post:
      tags: [store-ops]
      summary: 标记杯贴已打印（新杯贴打印是骑手到店交接决策的三因子之一）
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      responses:
        '200': {description: OK}
  /v1/staff/orders/{id}/item-oos:
    post:
      tags: [store-ops]
      summary: 接单后轻食/商品缺货 → 临时下架 + 作废旧杯回库 + 单品退款
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                cup_id: {type: integer}
                sku: {type: string, example: LF}
                note: {type: string, example: 鸡肉卷售罄}
      responses:
        '200': {description: 已处理}
  /v1/staff/orders/{id}/cup-labels:
    get:
      tags: [store-ops]
      summary: 杯贴打印数据（冰热/糖度/杯型/备注/出杯序号/封签码）
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      responses:
        '200': {description: OK}
  /v1/staff/orders/{id}/bag-labels:
    get:
      tags: [store-ops]
      summary: 袋贴打印数据（热饮袋/冷饮袋/餐食袋、每袋杯数）
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      responses:
        '200': {description: OK}
  /v1/staff/inventory/restock:
    post:
      tags: [store-ops]
      summary: 原料补货（可选自动恢复因缺货下架的商品）
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                store_id: {type: integer}
                resolve_delistings: {type: boolean}
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      ingredient_sku: {type: string, example: coldbase}
                      qty: {type: number, example: 2000}
      responses:
        '200': {description: OK}
  /v1/staff/menu/{sku}/delist:
    post:
      tags: [store-ops]
      summary: 门店手动临时下架
      parameters: [{name: sku, in: path, required: true, schema: {type: string}}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                store_id: {type: integer}
                reason: {type: string}
      responses:
        '201': {description: OK}
  /v1/staff/stores/{id}/surge:
    post:
      tags: [store-ops]
      summary: 爆单保护开关（临时限制接单，可设时长）
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                paused: {type: boolean}
                reason: {type: string, example: 午高峰爆单}
                minutes: {type: integer, example: 30}
      responses:
        '200': {description: OK}
  /v1/staff/stores/{id}/loss-reports:
    get:
      tags: [store-ops]
      summary: 门店异常报损记录
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      responses:
        '200': {description: OK}
  /v1/rider/arrivals:
    post:
      tags: [rider]
      summary: 骑手到店登记（提前到店未出杯自动产生 rider_early 异常；支持合并组）
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                order_id: {type: integer}
                platform_order_no: {type: string}
                group_id: {type: integer}
                rider_name: {type: string}
      responses:
        '200': {description: OK}
  /v1/rider/arrivals/{id}:
    get:
      tags: [rider]
      summary: 到店记录（等待时长、门店责任等待时长）
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      responses:
        '200': {description: OK}
  /v1/rider/screen:
    get:
      tags: [rider]
      summary: 骑手到店屏（在店等待骑手与出杯进度；骑手只看自己）
      parameters: [{name: store_id, in: query, schema: {type: integer}}]
      responses:
        '200': {description: OK}
  /v1/rider/handoffs:
    post:
      tags: [rider]
      summary: 取餐核验交接（订单号/袋数/冷热分袋/吸管餐具；不过则登记异常）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id]
              properties:
                order_id: {type: integer}
                platform_order_no: {type: string, description: 骑手核验订单号（与 order_id 二选一）}
                platform: {type: string, description: 店员按平台单号代核验时指定平台 eleme/meituan}
                rider_name: {type: string, description: 店员代核验时填写骑手姓名}
                actual_bags: {type: integer}
                actual_hot: {type: integer}
                actual_cold: {type: integer}
                actual_food: {type: integer}
                has_straw: {type: boolean}
                has_utensil: {type: boolean}
                seal_codes:
                  type: array
                  description: 骑手扫描的封签码。订单存在重做时必须扫新杯封签码；扫到旧码立即拒绝（old_seal_invalid）
                  items: {type: string}
      responses:
        '200': {description: 核验通过已交接}
        '409':
          description: >
            核验不通过/未出杯/已取消；重做相关错误码：old_seal_invalid(旧封签码已失效)、
            must_scan_new_seal(必须扫新码)、remake_new_not_ready(新杯未完成)
          content:
            application/json:
              schema:
                type: object
                properties:
                  passed: {type: boolean}
                  issues: {type: array, items: {type: string}}
  /v1/rider/orders/{id}/remake-decision:
    get:
      tags: [rider]
      summary: >
        重做进行中骑手到店的交接决策查询。三因子：原杯是否仍在硬安全窗口、新杯贴是否已打印、顾客是否已取消；
        返回每个进行中重做的系统推荐 wait_new / take_original / abort 及因子明细。
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      responses:
        '200': {description: OK}
    post:
      tags: [rider]
      summary: 执行交接决策（wait_new 继续等新杯 / take_original 取原杯 / abort 顾客取消终止），杜绝两杯同时交接
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                remake_id: {type: integer}
                decision: {type: string, enum: [wait_new, take_original, abort]}
      responses:
        '200': {description: 决策已执行}
        '409':
          description: >
            safety_window_expired(原杯超出硬安全窗口) / new_label_printed(新杯贴已打印) /
            new_cup_ready(新杯已封签) / original_not_servable(错杯漏备注原杯不可交接) /
            order_canceled / abort_requires_cancel
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /v1/customers/orders/{id}/complain:
    post:
      tags: [customer]
      summary: 顾客/平台客服投诉（漏液等），生成待财务定责异常与补偿挂账
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                type: {type: string, example: leak_complaint}
                detail: {type: string, example: 拿铁杯盖漏液撒了半杯}
                comp_amount: {type: number, description: 为空默认订单金额}
      responses:
        '201': {description: 已受理}
  /v1/customers/orders/{id}/delay:
    get:
      tags: [customer]
      summary: 顾客端展示延迟原因（重做状态/因子/等待）与补偿方案、骑手到店等待归因
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      responses:
        '200': {description: OK（delay_reasons/arrivals/remakes/compensations）}
  /v1/compensations:
    get:
      tags: [customer]
      summary: 补偿方案队列（proposed/fulfilled/voided），平台客服与财务用；店长只看本门店
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [proposed, confirmed, fulfilled, voided]}}
      responses:
        '200': {description: OK}
  /v1/platform/compensations/{id}/fulfill:
    post:
      tags: [customer]
      summary: 平台客服确认补偿是否已兑现（承担方按异常当前定责，含复核改判后的责任）
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                amount: {type: number, description: 为空按方案金额}
                note: {type: string, example: 优惠券已发放到顾客账户}
      responses:
        '200': {description: 已确认兑现}
        '409': {description: 已兑现/已作废}
  /v1/finance/exceptions/{id}:
    patch:
      tags: [finance]
      summary: 财务定责（store/rider/platform/customer/shared）、确定补偿与平台分摊
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                responsibility: {type: string, enum: [store, rider, platform, customer, shared]}
                comp_amount: {type: number}
                platform_share: {type: number}
                resolution: {type: string}
      responses:
        '200': {description: OK}
  /v1/stores/{id}/finance:
    get:
      tags: [finance]
      summary: 门店财务台账（收入/退款/重做成本/报损/顾客补偿/平台补贴与净利润影响）
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
        - {name: from, in: query, schema: {type: string, format: date}}
        - {name: to, in: query, schema: {type: string, format: date}}
      responses:
        '200': {description: OK}
  /v1/reports/stores/{id}/summary:
    get:
      tags: [management]
      summary: 门店报表（出杯慢/错杯/漏餐具/重做/平台取消对利润影响）
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
        - {name: from, in: query, schema: {type: string, format: date}}
        - {name: to, in: query, schema: {type: string, format: date}}
      responses:
        '200': {description: OK}
  /v1/reports/region:
    get:
      tags: [management]
      summary: 区域经理按门店对比报表
      parameters:
        - {name: region, in: query, schema: {type: string}}
        - {name: from, in: query, schema: {type: string, format: date}}
        - {name: to, in: query, schema: {type: string, format: date}}
      responses:
        '200': {description: OK}
  /v1/management/stores/{id}/team-score/refresh:
    post:
      tags: [management]
      summary: 刷新门店班组评分（出杯慢/错杯/漏餐具/取错袋/过久/漏备注/门店责任取消扣分）
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      responses:
        '200': {description: OK}
  /v1/management/stores/{id}/team-score:
    get:
      tags: [management]
      summary: 最新班组评分（含重做成本）
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      responses:
        '200': {description: OK}
  /v1/management/team-scores:
    get:
      tags: [management]
      summary: 区域班组评分榜
      responses:
        '200': {description: OK}
  /v1/stores/{id}/reviews:
    get:
      tags: [management]
      summary: 门店复盘列表（督导同步复盘）
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      responses:
        '200': {description: OK}
  /v1/management/stores/{id}/reviews:
    post:
      tags: [management]
      summary: 区域督导创建门店复盘（重做成本计入复盘）
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [from, to, summary]
              properties:
                from: {type: string, format: date}
                to: {type: string, format: date}
                summary: {type: string}
                actions: {type: array, items: {type: string}}
      responses:
        '201': {description: OK}
  /v1/management/exceptions/{id}/responsibility-review:
    post:
      tags: [management]
      summary: 店长对设备故障 / 平台派单延迟申请责任复核（不覆盖原始定责，只追加复核单）
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request_type, reason]
              properties:
                request_type: {type: string, enum: [equipment_fault, platform_dispatch_delay]}
                reason: {type: string}
                evidence: {type: object, additionalProperties: true}
      responses:
        '201': {description: 复核申请已提交（status=requested）}
        '409': {description: 已有待审批复核 review_pending}
  /v1/management/responsibility-reviews:
    get:
      tags: [management]
      summary: 责任复核单列表（可按 status 过滤）
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [requested, approved, rejected]}}
      responses:
        '200': {description: OK}
  /v1/management/responsibility-reviews/{id}/decision:
    post:
      tags: [management]
      summary: >
        区域经理复核改判。批准后：异常责任更新为最新判定，原始责任与原始事件保留；
        财务按原 period_date 追加“冲销+重挂”记录回算班组利润与补偿，绝不覆盖或删除原始记录。
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approve]
              properties:
                approve: {type: boolean}
                new_responsibility: {type: string, enum: [store, team, platform, shared]}
                note: {type: string}
      responses:
        '200': {description: 已审批（reallocated_finance_records 为追加的冲销/重挂条数）}
        '409': {description: 复核单已审批 review_closed}
components:
  securitySchemes:
    StaffCode:
      type: apiKey
      in: header
      name: X-Staff-Code
    BearerAuth:
      type: http
      scheme: bearer
  schemas:
    Error:
      type: object
      properties:
        error: {type: string}
        message: {type: string}
        details: {type: object, additionalProperties: true}
    IntakeRequest:
      type: object
      required: [platform, platform_order_no, items]
      properties:
        platform: {type: string, enum: [eleme, meituan], example: eleme}
        platform_order_no: {type: string, example: EM20260929001}
        store_id: {type: integer, example: 1}
        store_code: {type: string, example: SH001}
        customer_id: {type: string}
        customer_note: {type: string, example: 少冰，杯盖贴紧，不要摇！}
        promised_minutes: {type: integer, example: 15}
        rider_eta: {type: string, format: date-time}
        total_amount: {type: number}
        items:
          type: array
          items:
            type: object
            required: [sku, qty, temp, sugar, cup_size]
            properties:
              sku: {type: string, enum: [AM, LT, CB, FC, LF, SET]}
              qty: {type: integer, minimum: 1}
              temp: {type: string, enum: [hot, ice]}
              sugar: {type: string, enum: 无糖, 三分糖, 五分糖, 七分糖, 全糖}
              cup_size: {type: string, enum: [M, L, XL]}
              note: {type: string}
